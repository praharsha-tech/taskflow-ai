<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow AI</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #172033;
    }

    header {
      background: #172554;
      color: white;
      padding: 22px 7%;
    }

    header h1 { margin: 0 0 7px; }
    header p { margin: 0; color: #dbeafe; }

    main {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 18px;
    }

    .panel {
      background: white;
      padding: 24px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 4px 18px #1725540d;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font: inherit;
      resize: vertical;
    }

    button {
      background: #4f46e5;
      color: white;
      border: 0;
      border-radius: 9px;
      padding: 12px 18px;
      margin-top: 12px;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover { background: #3730a3; }

    .task {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 14px;
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .task input { width: 18px; height: 18px; }
    .task.done span {
      text-decoration: line-through;
      color: #64748b;
    }

    .muted { color: #64748b; line-height: 1.5; }
    .tag { color: #4338ca; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <h1>✦ TaskFlow AI</h1>
    <p>Turn your instructions into actionable plans.</p>
  </header>

  <main>
    <section class="panel">
      <h2>What do you need to organize?</h2>
      <p class="muted">
        Describe a task in everyday language.
      </p>

      <textarea id="instructions"
        placeholder="Example: Organize our hackathon demo. Finish the UI today, test the app tomorrow, and prepare the presentation."></textarea>

      <button id="generate">Generate my plan</button>
      <p id="message" class="muted" aria-live="polite"></p>
    </section>

    <section class="panel">
      <h2>My tasks</h2>
      <p class="muted">
        Check a task when you finish it.
      </p>
      <div id="tasks">
        <p class="muted">Your generated tasks will appear here.</p>
      </div>
    </section>

    <section class="panel">
      <h2>Workflow</h2>
      <div id="workflow" class="muted">
        Your workflow steps will appear here.
      </div>
    </section>
  </main>

  <script>
    const input = document.getElementById("instructions");
    const tasks = document.getElementById("tasks");
    const workflow = document.getElementById("workflow");
    const message = document.getElementById("message");

    document.getElementById("generate").addEventListener("click", () => {
      const text = input.value.trim();

      if (!text) {
        message.textContent = "Please enter your instructions first.";
        input.focus();
        return;
      }

      // Temporary task generation for our first demo.
      // We will replace this with a real AI connection later.
      const items = text
        .split(/[.!?\n]+/)
        .map(item => item.trim())
        .filter(Boolean);

      tasks.replaceChildren();
      workflow.replaceChildren();

      items.forEach((item, index) => {
        const label = document.createElement("label");
        label.className = "task";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";

        const span = document.createElement("span");
        span.textContent = item;

        checkbox.addEventListener("change", () => {
          label.classList.toggle("done", checkbox.checked);
        });

        label.append(checkbox, span);
        tasks.appendChild(label);

        const step = document.createElement("p");
        step.textContent = `${index + 1}. ${item}`;
        workflow.appendChild(step);
      });

      message.textContent =
        `Created ${items.length} task(s). This is the starter version; AI will be added next.`;
    });
  </script>
</body>
</html>
